<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Jayasakthi Balaji Govindaraju</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f766e, #14b8a6);
    background-attachment: fixed;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    margin: 0 auto 16px;
    background: rgba(255,255,255,.2);
    display: grid; place-items: center;
    font-size: 36px; font-weight: 700;
    border: 3px solid rgba(255,255,255,.6);
  }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p.tag { margin: 0 0 32px; opacity: .9; }
  .btn {
    display: flex; align-items: center; gap: 14px;
    background: #ffffff; color: #0f4f4a;
    text-decoration: none; font-weight: 600;
    padding: 16px 20px; margin-bottom: 14px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.btn:hover, a.btn:focus {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,.22);
  }
  div.btn { cursor: default; user-select: text; }
  .icon {
    min-width: 34px; height: 34px; border-radius: 9px;
    background: #0f766e; color: #fff;
    display: grid; place-items: center;
    font-size: .85rem; font-weight: 700;
  }
  .label { flex: 1; text-align: left; overflow-wrap: anywhere; }
  .arrow { opacity: .5; }
</style>
</head>
<body>
<main>
  <div class="avatar">JB</div>
  <h1>Jayasakthi Balaji Govindaraju</h1>
  <p class="tag">ML Engineer · AI &amp; Intelligent Systems · Bremen</p>
  <a class="btn" href="https://www.linkedin.com/in/jayasakthi-balaji-g" target="_blank" rel="noopener"><span class="icon">in</span><span class="label">LinkedIn</span><span class="arrow">&rarr;</span></a>
  <a class="btn" href="https://github.com/JayasakthiBalajiG/" target="_blank" rel="noopener"><span class="icon">&lt;/&gt;</span><span class="label">GitHub</span><span class="arrow">&rarr;</span></a>
  <div class="btn"><span class="icon">@</span><span class="label">jayasakthibg0502@gmail.com</span></div>
</main>
</body>
</html>
